<!doctype html>

<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>LabForge OG card</title>
		<style>
			* {
				margin: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 1200px;
				height: 630px;
			}
			body {
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				padding: 80px 88px;

			}
			.brand svg {
				width: 88px;
				height: 88px;
			}
			h1 {
				max-width: 940px;
				font-size: 68px;
				line-height: 1.1;
				font-weight: 700;
				letter-spacing: -0.02em;
			}
			.tags {
				display: flex;
				gap: 16px;
				font-size: 26px;
			}
			.tags span {
				padding: 10px 22px;
				border: 2px solid rgb(255 255 255 / 0.5);
				border-radius: 999px;
			}
			.note {
				font-size: 22px;
				color: #c7d2fe;
			}
			.footer {
				display: flex;
				align-items: flex-end;
				justify-content: space-between;

		<h1>Hands-on Azure and AWS labs that launch in the browser</h1>
		<div class="footer">
			<div class="tags"><span>Courses</span><span>Workshops</span><span>Product demos</span></div>
			<p class="note">Fictional product · portfolio project</p>
		</div>
